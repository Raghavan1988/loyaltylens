# Lint config for LoyaltyLens (ruff). Non-blocking: run `ruff check .` locally.
line-length = 100
target-version = "py311"
extend-exclude = ["data/generated", "activations", "results", "jlens/data"]

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E402"]

[lint.per-file-ignores]
"tests/*" = ["B"]
